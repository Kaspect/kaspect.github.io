<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastFarrier - Opt-in Workflow</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #2c3e50;
            margin: 0;
            font-size: 24px;
        }
        .header p {
            color: #7f8c8d;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #2c3e50;
        }
        input[type="text"], input[type="email"], input[type="tel"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #27ae60;
        }
        /* THE CRITICAL OPT-IN SECTION STYLING */
        .consent-section {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            margin-bottom: 25px;
        }
        .checkbox-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        input[type="checkbox"] {
            margin-top: 4px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .consent-text {
            font-size: 13px;
            line-height: 1.5;
            color: #555;
        }
        .consent-text a {
            color: #27ae60;
            text-decoration: underline;
            font-weight: 600;
        }
        .btn-submit {
            background-color: #27ae60;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background-color: #219150;
        }
        .footer-links {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #95a5a6;
        }
        .footer-links a {
            color: #7f8c8d;
            text-decoration: none;
            margin: 0 5px;
        }
    </style>
</head>
<body>

  

<div class="container">
    <div class="header">
        <h1>FastFarrier</h1>
        <p>Client Intake & Scheduling</p>
    </div>

    <!-- Form with proper name attributes and Formspree JSON headers -->
    <form action="https://formspree.io/f/mppqqraw" method="POST">
        <!-- Optional: Tells Formspree to return a JSON response -->
        <input type="hidden" name="_accept" value="application/json">

        <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. John Doe" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="(555) 555-5555" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="john@example.com" required>
        </div>

        <!-- OPT-IN EVIDENCE SECTION -->
        <div class="consent-section">
            <div class="checkbox-wrapper">
                <input type="checkbox" id="optin" name="consent" value="agreed" required>
                <label for="optin" class="consent-text">
                    I agree to the <a href="https://kaspect.com/fastfarrier">Terms of Service</a> and <a href="https://kaspect.com/fastfarrier">Privacy Policy</a>. 
                    I consent to FastFarrier collecting my data to facilitate scheduling services with my farrier.
                </label>
            </div>
        </div>

        <button type="submit" class="btn-submit">Submit Scheduling Request</button>
    </form>

        <div class="footer-links">
            <a href="mailto:brian.cohn@kaspect.com">Contact Support</a>
        </div>
        </div>
    </div>

</body>
</html>
